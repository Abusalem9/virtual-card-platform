spring:
  application:
    name: virtual-card-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/virtual_cards}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

server:
  shutdown: graceful

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"
  level:
    com.nium.virtualcard: INFO
